<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card - Box Model Demo</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">

    <div class="card__image">Product Image</div>

    <div class="card__body">
      <h2 class="card__title">Wireless Headphones</h2>
      <p class="card__description">
        Premium sound quality with active noise cancellation and 40-hour battery life.
      </p>
      <p class="card__price">$89.99</p>
      <button class="card__button">Add to Cart</button>
    </div>

  </div>

</body>
</html>
